<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ismael — GitHub HQ</title>
<style>
:root {
  --bg: #ffffff;
  --glass: rgba(12, 28, 70, 0.52);
  --glass-hover: rgba(14, 34, 82, 0.65);
  --glass-border: rgba(100, 150, 255, 0.22);
  --teal: #0abf9f;
  --blue: #3b82f6;
  --blue-soft: rgba(59,130,246,0.1);
  --text: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --danger: #ef4444;
  --warn: #f59e0b;
  --success: #10b981;
  --radius: 20px;
  --radius-sm: 12px;
}
/* Dark glass card text overrides */
.repo-card .card-name { color: #fff; }
.repo-card .card-desc { color: rgba(255,255,255,0.6); }
.repo-card .card-meta { color: rgba(255,255,255,0.4); }
.repo-card .health-good { background: rgba(16,185,129,0.18); color: #6ee7b7; }
.repo-card .health-warn { background: rgba(245,158,11,0.18); color: #fcd34d; }
.repo-card .health-bad  { background: rgba(239,68,68,0.18);  color: #fca5a5; }
.repo-card .badge-pub  { background: rgba(16,185,129,0.18); color: #6ee7b7; border-color: rgba(16,185,129,0.25); }
.repo-card .badge-priv { background: rgba(245,158,11,0.18); color: #fcd34d; border-color: rgba(245,158,11,0.25); }
.repo-card .badge-ts   { background: rgba(96,165,250,0.18); color: #93c5fd; border-color: rgba(96,165,250,0.25); }
.repo-card .badge-js   { background: rgba(234,179,8,0.18);  color: #fde68a; border-color: rgba(234,179,8,0.25);  }
.repo-card .badge-none { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); }
.repo-card .meta-dot.dot-green { background: #34d399; }
.repo-card .meta-dot.dot-amber { background: #fbbf24; }
.repo-card .meta-dot.dot-gray  { background: rgba(255,255,255,0.25); }
/* Feed card */
.feed-card { background: var(--glass); border-color: var(--glass-border); }
.feed-card .feed-title { color: #fff; }
.feed-card .feed-meta  { color: rgba(255,255,255,0.4); }
.feed-icon { background: rgba(255,255,255,0.08); }
.feed-repo { background: rgba(59,130,246,0.2); color: #93c5fd; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* BG blobs */
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
.blob1{width:550px;height:550px;background:rgba(99,179,237,0.22);top:-180px;right:-120px;}
.blob2{width:420px;height:420px;background:rgba(167,139,250,0.15);bottom:60px;left:-120px;}
.blob3{width:280px;height:280px;background:rgba(0,184,154,0.12);top:45%;right:5%;}

.container{max-width:480px;margin:0 auto;padding:0 20px 100px;position:relative;z-index:1;}

/* HEADER */
.header{text-align:center;padding:40px 0 20px;}
.avatar-wrap{position:relative;display:inline-block;margin-bottom:14px;}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#0abf9f,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:white;box-shadow:0 8px 30px rgba(59,130,246,0.3);}
.live-dot{position:absolute;bottom:3px;right:3px;width:13px;height:13px;background:#10b981;border-radius:50%;border:2px solid var(--bg);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)}50%{box-shadow:0 0 0 6px transparent}}
.header-name{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.header-sub{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:2.5px;margin:4px 0 20px;}

/* TABS */
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.tab{padding:9px 20px;border-radius:30px;border:1.5px solid rgba(147,197,253,0.35);background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s;}
.tab.active{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;color:white;box-shadow:0 4px 15px rgba(59,130,246,0.3);}
.tab:hover:not(.active){background:rgba(255,255,255,0.95);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.stat{background:rgba(255,255,255,0.8);backdrop-filter:blur(16px);border:1px solid rgba(147,197,253,0.35);border-radius:var(--radius-sm);padding:16px 8px;text-align:center;box-shadow:0 4px 20px rgba(59,130,246,0.07);}
.stat-val{font-size:26px;font-weight:800;color:var(--blue);margin-bottom:3px;}
.stat-label{font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:0.3px;}

/* ALERTS */
.alerts{margin-bottom:14px;}
.alert{display:flex;align-items:center;gap:10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.18);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;color:#b91c1c;margin-bottom:8px;}
.alert-dot{width:7px;height:7px;background:#ef4444;border-radius:50%;flex-shrink:0;}

/* SECTION */
.section{margin-bottom:24px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-align:center;display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:rgba(147,197,253,0.3);}

/* REPO CARD */
.repo-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;margin-bottom:12px;transition:all 0.2s;box-shadow:0 4px 20px rgba(59,130,246,0.05);}
.repo-card:hover{background:var(--glass-hover);transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,0.1);}
.repo-card.priority{border-color:rgba(0,184,154,0.4);box-shadow:0 4px 20px rgba(0,184,154,0.08);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.card-name{font-size:16px;font-weight:800;color:var(--text);}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:0.2px;}
.badge-pub{background:rgba(16,185,129,0.1);color:#059669;border:1px solid rgba(16,185,129,0.2);}
.badge-priv{background:rgba(245,158,11,0.1);color:#b45309;border:1px solid rgba(245,158,11,0.2);}
.badge-ts{background:rgba(59,130,246,0.1);color:#2563eb;border:1px solid rgba(59,130,246,0.2);}
.badge-js{background:rgba(234,179,8,0.1);color:#a16207;border:1px solid rgba(234,179,8,0.2);}
.badge-py{background:rgba(16,185,129,0.1);color:#047857;border:1px solid rgba(16,185,129,0.2);}
.badge-none{background:rgba(148,163,184,0.1);color:#64748b;border:1px solid rgba(148,163,184,0.2);}
.card-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px;}
.card-meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.meta-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
.dot-green{background:#10b981;}
.dot-amber{background:#f59e0b;}
.dot-gray{background:#94a3b8;}

/* Health */
.health{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.health-good{background:rgba(16,185,129,0.1);color:#059669;}
.health-warn{background:rgba(245,158,11,0.1);color:#b45309;}
.health-bad{background:rgba(239,68,68,0.1);color:#dc2626;}

/* Actions */
.card-actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn{padding:8px 13px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all 0.15s;display:inline-flex;align-items:center;gap:4px;font-family:inherit;}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--blue));color:white;box-shadow:0 3px 10px rgba(59,130,246,0.25);}
.btn-primary:hover{box-shadow:0 5px 15px rgba(59,130,246,0.35);transform:translateY(-1px);}
.btn-ghost{background:var(--blue-soft);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.btn-ghost:hover{background:rgba(59,130,246,0.16);}
.btn-teal{background:rgba(10,191,159,0.1);color:var(--teal);border:1px solid rgba(10,191,159,0.25);}
.btn-teal:hover{background:rgba(10,191,159,0.18);}
.btn-amber{background:rgba(245,158,11,0.1);color:#b45309;border:1px solid rgba(245,158,11,0.2);}

/* ACTIVITY FEED */
.feed-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;box-shadow:0 4px 20px rgba(59,130,246,0.05);}
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(147,197,253,0.15);}
.feed-item:last-child{border-bottom:none;padding-bottom:0;}
.feed-icon{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.feed-body{flex:1;min-width:0;}
.feed-title{font-size:13px;color:var(--text);font-weight:500;line-height:1.4;}
.feed-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.feed-repo{font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:10px;display:inline-block;margin-top:3px;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:white;border-radius:24px;padding:28px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(15,23,42,0.18);}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
label{font-size:12px;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:6px;letter-spacing:0.3px;}
.finput,.fselect,.ftextarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(147,197,253,0.5);background:#f8faff;font-size:14px;color:var(--text);outline:none;margin-bottom:16px;font-family:inherit;transition:border-color 0.2s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--blue);}
.ftextarea{resize:vertical;min-height:90px;}
.modal-btns{display:flex;gap:10px;}
.mbtn-cancel{flex:1;padding:13px;border-radius:12px;background:#f1f5f9;color:var(--text-secondary);font-weight:700;font-size:14px;border:none;cursor:pointer;font-family:inherit;}
.mbtn-ok{flex:2;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--blue));color:white;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 4px 15px rgba(59,130,246,0.3);}
.mbtn-ok:disabled{opacity:0.6;cursor:not-allowed;}

/* LOADING */
.skeleton{background:linear-gradient(90deg,rgba(147,197,253,0.15)25%,rgba(147,197,253,0.28)50%,rgba(147,197,253,0.15)75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel{height:14px;margin-bottom:10px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);border-top:1px solid rgba(147,197,253,0.25);display:flex;justify-content:space-around;align-items:center;padding:10px 0 20px;z-index:100;box-shadow:0 -4px 20px rgba(59,130,246,0.07);}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-muted);cursor:pointer;padding:4px 10px;border-radius:12px;transition:all 0.2s;min-width:58px;}
.nav-item.active{color:var(--blue);}
.nav-icon{font-size:21px;line-height:1;}
.nav-item svg{display:block;margin:0 auto;}
.nav-dot{width:4px;height:4px;background:var(--blue);border-radius:50%;margin-top:1px;}

/* FAB */
.fab{position:fixed;bottom:92px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));box-shadow:0 6px 22px rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;z-index:99;border:none;color:white;transition:all 0.2s;line-height:1;}
.fab:hover{transform:scale(1.1);box-shadow:0 8px 28px rgba(59,130,246,0.5);}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#059669;color:white;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:700;z-index:2000;transition:transform 0.35s ease;box-shadow:0 4px 20px rgba(5,150,105,0.4);}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Section hidden */
.hidden{display:none!important;}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar">I</div>
      <div class="live-dot"></div>
    </div>
    <div class="header-name">Ismael Sudally</div>
    <div class="header-sub">GITHUB HQ</div>
    <div class="tabs">
      <div class="tab active" onclick="setTab('all')">All Projects</div>
      <div class="tab" onclick="setTab('arie')">Arie Finance</div>
      <div class="tab" onclick="setTab('ismael')">By Ismael</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-val" id="s-repos">—</div><div class="stat-label">Active</div></div>
    <div class="stat"><div class="stat-val" id="s-prs">—</div><div class="stat-label">Open PRs</div></div>
    <div class="stat"><div class="stat-val" id="s-issues">—</div><div class="stat-label">Issues</div></div>
    <div class="stat"><div class="stat-val" id="s-today">—</div><div class="stat-label">Today</div></div>
  </div>

  <!-- Alerts -->
  <div class="alerts" id="alerts"></div>

  <!-- Arie Finance -->
  <div class="section" id="section-arie">
    <div class="section-label">ARIE FINANCE</div>
    <div id="arie-repos">
      <div class="repo-card"><div class="skel skeleton" style="width:60%;height:16px;margin-bottom:8px;"></div><div class="skel skeleton w80" style="width:80%;"></div><div class="skel skeleton" style="width:40%;margin-top:14px;height:12px;"></div></div>
      <div class="repo-card"><div class="skel skeleton" style="width:55%;height:16px;margin-bottom:8px;"></div><div class="skel skeleton" style="width:75%;"></div></div>
    </div>
  </div>

  <!-- By Ismael -->
  <div class="section" id="section-ismael">
    <div class="section-label">BY ISMAEL</div>
    <div id="byismael-repos">
      <div class="repo-card"><div class="skel skeleton" style="width:65%;height:16px;margin-bottom:8px;"></div><div class="skel skeleton" style="width:80%;"></div></div>
    </div>
  </div>

  <!-- Activity Feed -->
  <div class="section" id="section-feed">
    <div class="section-label">RECENT ACTIVITY</div>
    <div class="feed-card" id="feed-list">
      <div class="feed-item"><div class="feed-icon">⏳</div><div class="feed-body"><div class="feed-title">Loading activity...</div></div></div>
    </div>
  </div>

</div>

<!-- FAB: Create Task/Issue -->
<button class="fab" onclick="openModal()" title="Add a task">＋</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Create Issue Modal -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">📝 Add a Task</div>
    <div class="modal-sub">Creates a task in the selected project so your AI assistant can pick it up.</div>
    <label>Project</label>
    <select class="fselect" id="modal-repo">
      <option value="ops-intelligence-hub">Arie — Ops Intelligence Hub</option>
      <option value="people-ops-platform">Arie — People Ops Platform</option>
      <option value="onboarda-backup">Arie — Onboarda (Compliance)</option>
      <option value="thewanderingdodo">By Ismael — The Wandering Dodo</option>
      <option value="dyad-reworked">By Ismael — Dyad (AI Builder)</option>
    </select>
    <label>What needs to be done?</label>
    <input class="finput" id="modal-title" type="text" placeholder="e.g. Add export button to reports page"/>
    <label>More detail (optional)</label>
    <textarea class="ftextarea" id="modal-body" placeholder="Any extra context, screenshots, or notes..."></textarea>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn-ok" id="modal-submit" onclick="submitIssue()">Create Task →</button>
    </div>
  </div>
</div>
